services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ML_FORECAST_URL: http://ml-forecast:8001
      ML_FORECAST_TIMEOUT_MS: 12000
    ports:
      - "3000:3000"
    depends_on:
      ml-forecast:
        condition: service_healthy

  ml-forecast:
    build:
      context: ./services/ml-forecast
      dockerfile: Dockerfile
    environment:
      PORT: 8001
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3).read()",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
